name: Glutt
options:
  bundleIdPrefix: com.malik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Glutt:
    type: application
    platform: iOS
    sources:
      - Glutt
    info:
      path: Glutt/Info.plist
      properties:
        CFBundleDisplayName: Glutt
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.malik.glutt
            CFBundleURLSchemes:
              - glutt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malik.glutt
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ENABLE_USER_SCRIPT_SANDBOXING: true

  GluttTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GluttTests
    dependencies:
      - target: Glutt

schemes:
  Glutt:
    build:
      targets:
        Glutt: all
    test:
      targets:
        - GluttTests
    run:
      config: Debug
    archive:
      config: Release
