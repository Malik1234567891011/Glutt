name: Glutt
options:
  bundleIdPrefix: com.malik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: K8MRHHZ85N
    CODE_SIGN_STYLE: Automatic

targets:
  Glutt:
    type: application
    platform: iOS
    sources:
      - Glutt
    info:
      path: Glutt/Info.plist
      properties:
        CFBundleDisplayName: Glutt
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.malik.glutt
            CFBundleURLSchemes:
              - glutt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malik.glutt
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ENABLE_USER_SCRIPT_SANDBOXING: true
        CODE_SIGN_ENTITLEMENTS: Glutt/Glutt.entitlements
    dependencies:
      - target: GluttShare

  GluttShare:
    type: app-extension
    platform: iOS
    sources:
      - GluttShare
    info:
      path: GluttShare/Info.plist
      properties:
        CFBundleDisplayName: Glutt
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malik.glutt.share
        CODE_SIGN_ENTITLEMENTS: GluttShare/GluttShare.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SKIP_INSTALL: true

  GluttTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GluttTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Glutt

schemes:
  Glutt:
    build:
      targets:
        Glutt: all
    test:
      targets:
        - GluttTests
    run:
      config: Debug
    archive:
      config: Release
