name: Glutt
options:
  bundleIdPrefix: com.omarlahmimi
  deploymentTarget:
    # 17.2 is the floor for Meta's Device Access Toolkit 0.9.0 (raised from 15.2
    # in that release). Nothing else here needs it.
    iOS: "17.2"
  createIntermediateGroups: true
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Omar's paid team. This is what ships, and the app group
    # (group.com.omarlahmimi.glutt) only provisions under it. Signing on another
    # team is a local-only change — keep it out of commits.
    DEVELOPMENT_TEAM: Q7ZLXMG4SB
    CODE_SIGN_STYLE: Automatic

packages:
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    from: "4.0.0"
  # libWebRTC for Polly v2's OpenAI Realtime WebRTC transport. LiveKit's build is
  # used STANDALONE (no LiveKit SDK/Cloud) because its ObjC layer exposes the
  # capture-side audio hooks (LKRTCAudioCustomProcessingDelegate) the wake-word
  # listener needs — stasel/WebRTC has none. Pinned exactly: floating majors of a
  # binary framework are not reproducible. See docs/webrtc-transport-vetting-2026-07-23.md.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: "144.7559.11"
  # Product analytics (US region). App target only — the share extension runs
  # under a tight memory budget and has nothing to report.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.68.4"
  # Meta app events, for the Facebook and Instagram ad campaigns. Two jobs:
  # SKAdNetwork install attribution (the SDK owns the conversion values, and
  # only one SDK in an app may), and the `StartTrial` conversion the ad sets
  # optimize delivery on. App target only — the share extension has no funnel
  # to report and is on a tight memory budget.
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "18.1.0"
  # Accounts (Sign in with Apple). App target only: the share extension has no
  # session and attributes its proxy calls by install id instead.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.54.0"
  # Ray-Ban Meta camera access. Binary xcframeworks committed straight into the
  # repo's tags (there is no Package.swift on `main`), so this MUST resolve by
  # exact version — same reasoning as LiveKitWebRTC above. Developer preview:
  # 0.8 -> 0.9 removed DeviceSession.addStream entirely. Ships arm64 + simulator
  # slices, which is what lets the mock device work on the sim.
  # See docs/meta-glasses-research-2026-08-04.md.
  # SPIKE: pinned to 0.8.0 to reach the Bluetooth Classic camera transport.
  # 0.9 is Wi-Fi only. See docs/glasses-transport-and-memory.md.
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "0.8.0"
  # Native Google sign-in. The browser flow would need no dependency, but the
  # Supabase Google provider is configured with a client id and no secret, which
  # is the native (id_token) setup; /auth/v1/authorize rejects the web flow with
  # "missing OAuth secret".
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"

targets:
  Glutt:
    type: application
    platform: iOS
    sources:
      # ImportSheet / ImportProgressViews were excluded while the design-loading
      # UI was half-landed. ShareImportViewModel now has the API they expect, so
      # they compile into both targets again.
      - Glutt
    info:
      path: Glutt/Info.plist
      properties:
        CFBundleDisplayName: Glutt
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # The design system is a deliberate light (cream/green) identity.
        # Must live HERE, not as INFOPLIST_KEY_* build setting — those are
        # ignored when a custom Info.plist file is used. Dark theme: backlog.
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - BricolageGrotesque-Variable.ttf
          - Nunito-Variable.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Glutt uses the camera to scan your fridge or pantry, to estimate meals you log from photos, and to let Chef watch the pan during live cooking sessions.
        NSMicrophoneUsageDescription: Glutt uses the microphone so you can tell it what’s in your kitchen, and so Chef can guide you hands-free while you cook.
        NSSpeechRecognitionUsageDescription: Glutt recognizes speech on-device so you can list kitchen ingredients out loud, and so Chef only wakes when you say “Chef” — not to background chatter.
        # Asked once, at the end of onboarding, right before the paywall. Not on
        # first launch: the answer is worth far more after someone has seen what
        # the app is, and it has to be answered *before* the trial starts or the
        # conversion it would attribute has already happened.
        NSUserTrackingUsageDescription: Glutt uses this to measure which ads brought new cooks to the app. It changes nothing about what you see inside Glutt.
        ITSAppUsesNonExemptEncryption: false
        # Meta app events, read by the Facebook SDK at launch. Both values come
        # from the app's page on developers.facebook.com (the client token is
        # under Settings > Advanced). The client token is publishable — same
        # class of value as the Superwall and PostHog keys in the source.
        FacebookAppID: "1015291791330103"
        FacebookClientToken: "5d1df788714aab27e93fada27215ae02"
        FacebookDisplayName: Glutt
        # Deliberately NOT declared: the `fb<app-id>` URL scheme and the
        # `fbapi` / `fb-messenger-share-api` query schemes from Meta's setup
        # page. Both only exist to bring a user back from the Facebook app after
        # a Login or Share dialog, and Glutt links neither FacebookLogin nor
        # FacebookShare. Add them the day one of those ships.
        #
        # Apple hands install postbacks only to ad networks the app names here,
        # so without these two identifiers Meta can measure events but cannot
        # attribute a single install to a campaign. The Facebook SDK owns the
        # conversion values; only one SDK per app may, which is why there is no
        # AppsFlyer/Adjust alongside it.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
        # Meta Wearables Device Access Toolkit. MetaAppID "0" is the Developer
        # Mode value (toggled in Meta AI > Settings > Your glasses), which is a
        # different thing from a Wearables Developer Center account — that is
        # only needed to distribute to other people, and brings ClientToken and
        # TeamID with it. Add those when we have a release channel.
        MWDAT:
          AppLinkURLScheme: "glutt-wearables://"
          MetaAppID: "0"
          # Opt out of the Device Access Toolkit App Model.
          #
          # Meta's own engineer, discussion #226: "there is an issue where we can
          # drop frames when you are using bluetooth as the transport channel and
          # have DAM enabled. BTC transport & DAM will be the default behaviour
          # if you update your app from the 0.7 sdk to 0.8 sdk." That is Glutt
          # exactly: we hold the camera on Bluetooth with the MFi keys below, and
          # DAM defaults to on in 0.8 for anyone who says nothing.
          #
          # Measured by `jeffhoang` on the same thread: with DAM on, frames stop
          # dead 5 to 9 seconds in and never return, with nothing on any error
          # channel. With this key, a 30+ minute continuous run and only the
          # ordinary 1 to 2 second stalls that recover by themselves. Our cooks
          # froze at 12 to 19 seconds, which is the same failure.
          #
          # An earlier comment here claimed the key was not read in 0.8 because
          # the string does not appear in the framework binary. `strings` does not
          # enumerate Swift string literals, so that showed nothing either way.
          # GlassesDAMConfigTests asserts the real answer against the real bundle.
          #
          # This is why the SDK stays pinned to 0.8.0: 0.9 removed the opt-out and
          # shipped no decoder fix.
          DAMEnabled: false
        # The toolkit finds Meta AI with `UIApplication.canOpenURL`, which
        # silently returns false for any scheme not listed here. Without it the
        # SDK reports Meta AI as not installed when it is sitting on the home
        # screen, and registration fails with an error that names the wrong
        # problem.
        LSApplicationQueriesSchemes:
          - fb-viewapp
        # The Bluetooth Classic selector, half one of two.
        #
        # `vinidlidoo` in discussion #226, after getting Wi-Fi working on 0.8:
        # "we also had to remove the ExternalAccessory wiring
        #  (UISupportedExternalAccessoryProtocols + the external-accessory
        #  background mode) before the transport would engage."
        #
        # So these keys hold the camera on BTC and removing them is what lets
        # softAP take over. They come from the 0.7-era integration guide; the
        # 0.9 docs we built against dropped them, which is why Glutt has been on
        # Wi-Fi since the first line of glasses code and has never once asked
        # for Bluetooth.
        #
        # `com.meta.ar.wearable` is the MFi protocol. Corroborated by the App
        # Store rejections on issues #114, #167 and #169, all of which are apps
        # declaring exactly this string.
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        # NSLocalNetworkUsageDescription and NSBonjourServices are deliberately
        # ABSENT. Both exist only so the softAP socket layer can work, and the
        # softAP is the transport we are avoiding. They go back in together with
        # HotspotConfiguration on the day this returns to Wi-Fi; see
        # docs/glasses-bluetooth.md for the whole switch.
        # Exactly one mode, and the list is a minefield, so read this before
        # adding a second.
        #
        # `external-accessory` is half of the Bluetooth Classic selector for the
        # glasses (the other half is UISupportedExternalAccessoryProtocols
        # above). Without it the toolkit falls back to the softAP and takes the
        # phone off its own Wi-Fi.
        #
        # `bluetooth-central` and `bluetooth-peripheral` must NEVER come back.
        # They are Core Bluetooth (BLE) modes and Glutt has no Core Bluetooth at
        # all: no `import CoreBluetooth`, no CBCentralManager, no CBPeripheral.
        # The glasses reach the camera over Bluetooth *Classic* through
        # ExternalAccessory, which is a different transport entirely. They were
        # added with the BTC selector on the assumption that anything Bluetooth
        # needed them, bought nothing, and cost 1.2.2 (16) a rejection under
        # guideline 2.5.4 on 2026-08-17: "we are unable to locate any Bluetooth
        # Low Energy functionality", which was exactly correct.
        #
        # `processing` is the same mistake one step behind. It only ever runs
        # through BGTaskScheduler, nothing here submits a BGProcessingTaskRequest,
        # and declaring it made App Store validation demand a
        # BGTaskSchedulerPermittedIdentifiers list we have no identifiers for.
        #
        # Meta's own sample also lists `audio`. Deliberately omitted: Polly stands
        # down on background on purpose (PollySessionView scenePhase).
        UIBackgroundModes:
          - external-accessory
        CFBundleURLTypes:
          - CFBundleURLName: com.omarlahmimi.glutt
            CFBundleURLSchemes:
              - glutt
          # Meta AI calls back here after the user approves the integration.
          # Its own scheme, not `glutt`, so the callback can never be confused
          # with an ordinary Glutt deep link.
          - CFBundleURLName: com.omarlahmimi.glutt.wearables
            CFBundleURLSchemes:
              - glutt-wearables
          # Google sign-in callback. Must be the iOS client id reversed, exactly;
          # GoogleSignIn hands this scheme to ASWebAuthenticationSession and the
          # flow dead-ends without it. See Secrets.googleClientID.
          - CFBundleURLName: com.googleusercontent.apps
            CFBundleURLSchemes:
              - com.googleusercontent.apps.326973383718-tmur4tp76aicsnvih43tkn36u7aj44tk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarlahmimi.glutt
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 17
        MARKETING_VERSION: "1.2.2"
        ENABLE_USER_SCRIPT_SANDBOXING: true
        CODE_SIGN_ENTITLEMENTS: Glutt/Glutt.entitlements
    dependencies:
      - target: GluttShare
      - package: SuperwallKit
      - package: LiveKitWebRTC
      - package: PostHog
      - package: FacebookSDK
        product: FacebookCore
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      # MWDATMockDevice is DELIBERATELY NOT LINKED HERE. It lives on the
      # GluttTests target instead, which gets us the mock for automated
      # measurement without ever putting it in a shippable app. See the harness
      # in GluttTests/Glasses/. It statically duplicates the
      # same internal SUPMediaStream* and FB* ObjC classes as MWDATCamera, and
      # dyld warns that this "may cause spurious casting failures and mysterious
      # crashes". It did: the app died the moment a real stream reached
      # waitingForDevice. Every use of it is behind
      # `#if canImport(MWDATMockDevice)`, so add the product back here to get the
      # mock device and the -mockGlasses rig, and expect the crash back with it.

  GluttShare:
    type: app-extension
    platform: iOS
    sources:
      - GluttShare
      - path: Glutt/Models/Enums.swift
      - path: Glutt/Services/Import/ImportedRecipeDraft.swift
      - path: Glutt/Services/Import/RecipeImportService.swift
      - path: Glutt/Services/Import/RedditImport.swift
      - path: Glutt/Services/Import/RecipeHTMLParser.swift
      # Markup fallback for pages whose JSON-LD Recipe node is empty.
      - path: Glutt/Services/Import/RecipeBodyParser.swift
      - path: Glutt/Services/Import/SocialMediaImport.swift
      # Reached from RecipeImportService, so the extension needs them to link.
      - path: Glutt/Services/Import/InstagramImport.swift
      - path: Glutt/Services/Import/PinterestImport.swift
      - path: Glutt/Services/Import/TextRecipeParser.swift
      - path: Glutt/Services/Import/IngredientLineParser.swift
      - path: Glutt/Services/Import/ServingEstimator.swift
      - path: Glutt/Services/Import/ImportPipeline.swift
      - path: Glutt/Services/Import/VideoTranscript.swift
      - path: Glutt/Services/Import/SpeechTranscriptionClient.swift
      - path: Glutt/Services/Import/VideoRecipeCompiler.swift
      - path: Glutt/Services/Import/ImportInbox.swift
      - path: Glutt/Services/Import/ShareImportViewModel.swift
      # App-group pantry coverage for the share-sheet confirmation line.
      - path: Glutt/Services/Import/PantrySnapshot.swift
      # The share sheet's own UI vocabulary. Both files live in the app target
      # but the extension is what renders them, so they compile into it too.
      - path: Glutt/Features/Import/ImportProgressViews.swift
      - path: Glutt/Features/Import/ImportSheet.swift
      # Shared with the app target — extension needs the same canonicalizer for
      # pantry-coverage lines on the share-sheet preview.
      - path: Glutt/Services/IngredientCanonicalizer.swift
      - path: Glutt/Services/Import/PendingImportStore.swift
      - path: Glutt/Services/AI/LLMClient.swift
      - path: Glutt/Services/AI/Secrets.swift
      # Shared so extension proxy calls attribute to the SAME install as the
      # app. Reads the id via the app group; see InstallID.swift.
      - path: Glutt/Services/Analytics/InstallID.swift
      # Gitignored; created from Secrets.local.example.plist. Optional so a
      # fresh clone still generates + builds (AI features off until created).
      - path: Glutt/Services/AI/Secrets.local.plist
        optional: true
      - path: Glutt/Services/AI/DraftCleanup.swift
      - path: Glutt/DesignSystem/Theme.swift
      - path: Glutt/DesignSystem/Typography.swift
      - path: Glutt/DesignSystem/BrandFonts.swift
      - path: Glutt/DesignSystem/Components/Buttons.swift
      # Brand faces for the share-sheet import UI (system-font fallback without them).
      - path: Glutt/Resources/Fonts/BricolageGrotesque-Variable.ttf
        buildPhase: resources
      - path: Glutt/Resources/Fonts/Nunito-Variable.ttf
        buildPhase: resources
      # Optional until the cooking-loop asset is checked into Resources/Animations.
      - path: Glutt/Resources/Animations/cooking-loop.mp4
        buildPhase: resources
        optional: true
    info:
      path: GluttShare/Info.plist
      properties:
        CFBundleDisplayName: Glutt
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - BricolageGrotesque-Variable.ttf
          - Nunito-Variable.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarlahmimi.glutt.share
        CODE_SIGN_ENTITLEMENTS: GluttShare/GluttShare.entitlements
        CURRENT_PROJECT_VERSION: 17
        MARKETING_VERSION: "1.2.2"
        SKIP_INSTALL: true

  GluttTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GluttTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Glutt
      # The mock device lives HERE and nowhere else. Linking it into the app
      # duplicates MWDATCamera's internal SUPMediaStream*/FB* ObjC classes and
      # crashes real streams; a unit-test bundle is injected into the app at
      # test time only, so the harness gets a fake pair of glasses and no
      # shipping build ever carries the symbols.
      #
      # This is what makes glasses behaviour measurable without hardware. Two
      # non-obvious prerequisites, both from Meta on issue #197: the fixture
      # handed to `setCameraFeed` MUST be H.265 (an H.264 file fails silently
      # and delivers zero frames), and the test run must sign ad-hoc with
      # CODE_SIGN_IDENTITY="-" rather than CODE_SIGNING_ALLOWED=NO, because
      # `Wearables.configure()` does keychain work that throws without a
      # signing identity.
      - package: MetaWearablesDAT
        product: MWDATMockDevice

schemes:
  Glutt:
    build:
      targets:
        Glutt: all
    test:
      targets:
        - GluttTests
    run:
      config: Debug
      commandLineArguments:
        # Polly v2 Phase 1 transport spike screen. Tick in the scheme editor to
        # use on a device; deleted with the spike before the v2 merge.
        "-pollyV2Spike": false
    archive:
      config: Release

  # Runs the glasses memory matrix, which is skipped everywhere else because it
  # takes minutes and would distort the suite baseline.
  #
  # A separate scheme rather than a test plan or a `-only-testing` flag, because
  # the gate is an environment variable and there is no way to get one into a
  # unit-test host from the xcodebuild command line: plain `FOO=1 xcodebuild`
  # stops at the build system, and the `TEST_RUNNER_` prefix only reaches a
  # XCUITest runner process, not an app hosting unit tests. A scheme test action
  # is the one place that setting survives into the simulator.
  #
  #   xcodebuild test -scheme "Glutt Glasses Matrix" \
  #     -destination 'platform=iOS Simulator,name=iPhone 17' \
  #     -only-testing:GluttTests/GlassesMemoryMatrixTests/testA_timeVersusFrames \
  #     CODE_SIGN_IDENTITY="-"
  Glutt Glasses Matrix:
    build:
      targets:
        Glutt: [test]
    test:
      config: Debug
      environmentVariables:
        GLUTT_GLASSES_MATRIX: "1"
      targets:
        - GluttTests

  # Release-config scheme for testing a production-like build locally. Passes
  # `-seed` so demo recipes are populated when you RUN it from Xcode (handy for
  # testing with real-looking content). Note: launch arguments don't survive a
  # TestFlight upload, so actual distributed beta/App Store builds still start empty.
  Glutt Beta:
    build:
      targets:
        Glutt: all
    run:
      config: Release
      commandLineArguments:
        "-seed": true
    archive:
      config: Release
