name: Glutt
options:
  bundleIdPrefix: com.omarlahmimi
  deploymentTarget:
    # 17.2 is the floor for Meta's Device Access Toolkit 0.9.0 (raised from 15.2
    # in that release). Nothing else here needs it.
    iOS: "17.2"
  createIntermediateGroups: true
  xcodeVersion: "26.2"

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Omar's paid team. This is what ships, and the app group
    # (group.com.omarlahmimi.glutt) only provisions under it. Signing on another
    # team is a local-only change — keep it out of commits.
    DEVELOPMENT_TEAM: Q7ZLXMG4SB
    CODE_SIGN_STYLE: Automatic

packages:
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    from: "4.0.0"
  # libWebRTC for Polly v2's OpenAI Realtime WebRTC transport. LiveKit's build is
  # used STANDALONE (no LiveKit SDK/Cloud) because its ObjC layer exposes the
  # capture-side audio hooks (LKRTCAudioCustomProcessingDelegate) the wake-word
  # listener needs — stasel/WebRTC has none. Pinned exactly: floating majors of a
  # binary framework are not reproducible. See docs/webrtc-transport-vetting-2026-07-23.md.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: "144.7559.11"
  # Product analytics (US region). App target only — the share extension runs
  # under a tight memory budget and has nothing to report.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.68.4"
  # Accounts (Sign in with Apple). App target only: the share extension has no
  # session and attributes its proxy calls by install id instead.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.54.0"
  # Ray-Ban Meta camera access. Binary xcframeworks committed straight into the
  # repo's tags (there is no Package.swift on `main`), so this MUST resolve by
  # exact version — same reasoning as LiveKitWebRTC above. Developer preview:
  # 0.8 -> 0.9 removed DeviceSession.addStream entirely. Ships arm64 + simulator
  # slices, which is what lets the mock device work on the sim.
  # Native Google sign-in. The browser flow would need no dependency, but the
  # Supabase Google provider is configured with a client id and no secret, which
  # is the native (id_token) setup; /auth/v1/authorize rejects the web flow with
  # "missing OAuth secret".
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"

targets:
  Glutt:
    type: application
    platform: iOS
    sources:
      # ImportSheet / ImportProgressViews were excluded while the design-loading
      # UI was half-landed. ShareImportViewModel now has the API they expect, so
      # they compile into both targets again.
      - Glutt
    info:
      path: Glutt/Info.plist
      properties:
        CFBundleDisplayName: Glutt
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # The design system is a deliberate light (cream/green) identity.
        # Must live HERE, not as INFOPLIST_KEY_* build setting — those are
        # ignored when a custom Info.plist file is used. Dark theme: backlog.
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - BricolageGrotesque-Variable.ttf
          - Nunito-Variable.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Glutt uses the camera to scan your fridge or pantry, to estimate meals you log from photos, and to let Chef watch the pan during live cooking sessions.
        NSMicrophoneUsageDescription: Glutt uses the microphone so you can tell it what’s in your kitchen, and so Chef can guide you hands-free while you cook.
        NSSpeechRecognitionUsageDescription: Glutt recognizes speech on-device so you can list kitchen ingredients out loud, and so Chef only wakes when you say “Chef” — not to background chatter.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - processing
        CFBundleURLTypes:
          - CFBundleURLName: com.omarlahmimi.glutt
            CFBundleURLSchemes:
              - glutt
          # Google sign-in callback. Must be the iOS client id reversed, exactly;
          # GoogleSignIn hands this scheme to ASWebAuthenticationSession and the
          # flow dead-ends without it. See Secrets.googleClientID.
          - CFBundleURLName: com.googleusercontent.apps
            CFBundleURLSchemes:
              - com.googleusercontent.apps.326973383718-tmur4tp76aicsnvih43tkn36u7aj44tk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarlahmimi.glutt
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 13
        MARKETING_VERSION: "1.2.1"
        ENABLE_USER_SCRIPT_SANDBOXING: true
        CODE_SIGN_ENTITLEMENTS: Glutt/Glutt.entitlements
    dependencies:
      - target: GluttShare
      - package: SuperwallKit
      - package: LiveKitWebRTC
      - package: PostHog
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
  GluttShare:
    type: app-extension
    platform: iOS
    sources:
      - GluttShare
      - path: Glutt/Models/Enums.swift
      - path: Glutt/Services/Import/ImportedRecipeDraft.swift
      - path: Glutt/Services/Import/RecipeImportService.swift
      - path: Glutt/Services/Import/RedditImport.swift
      - path: Glutt/Services/Import/RecipeHTMLParser.swift
      # Markup fallback for pages whose JSON-LD Recipe node is empty.
      - path: Glutt/Services/Import/RecipeBodyParser.swift
      - path: Glutt/Services/Import/SocialMediaImport.swift
      # Reached from RecipeImportService, so the extension needs them to link.
      - path: Glutt/Services/Import/InstagramImport.swift
      - path: Glutt/Services/Import/PinterestImport.swift
      - path: Glutt/Services/Import/TextRecipeParser.swift
      - path: Glutt/Services/Import/IngredientLineParser.swift
      - path: Glutt/Services/Import/ServingEstimator.swift
      - path: Glutt/Services/Import/ImportPipeline.swift
      - path: Glutt/Services/Import/VideoTranscript.swift
      - path: Glutt/Services/Import/SpeechTranscriptionClient.swift
      - path: Glutt/Services/Import/VideoRecipeCompiler.swift
      - path: Glutt/Services/Import/ImportInbox.swift
      - path: Glutt/Services/Import/ShareImportViewModel.swift
      # App-group pantry coverage for the share-sheet confirmation line.
      - path: Glutt/Services/Import/PantrySnapshot.swift
      # The share sheet's own UI vocabulary. Both files live in the app target
      # but the extension is what renders them, so they compile into it too.
      - path: Glutt/Features/Import/ImportProgressViews.swift
      - path: Glutt/Features/Import/ImportSheet.swift
      # Shared with the app target — extension needs the same canonicalizer for
      # pantry-coverage lines on the share-sheet preview.
      - path: Glutt/Services/IngredientCanonicalizer.swift
      - path: Glutt/Services/Import/PendingImportStore.swift
      - path: Glutt/Services/AI/LLMClient.swift
      - path: Glutt/Services/AI/Secrets.swift
      # Shared so extension proxy calls attribute to the SAME install as the
      # app. Reads the id via the app group; see InstallID.swift.
      - path: Glutt/Services/Analytics/InstallID.swift
      # Gitignored; created from Secrets.local.example.plist. Optional so a
      # fresh clone still generates + builds (AI features off until created).
      - path: Glutt/Services/AI/Secrets.local.plist
        optional: true
      - path: Glutt/Services/AI/DraftCleanup.swift
      - path: Glutt/DesignSystem/Theme.swift
      - path: Glutt/DesignSystem/Typography.swift
      - path: Glutt/DesignSystem/BrandFonts.swift
      - path: Glutt/DesignSystem/Components/Buttons.swift
      # Brand faces for the share-sheet import UI (system-font fallback without them).
      - path: Glutt/Resources/Fonts/BricolageGrotesque-Variable.ttf
        buildPhase: resources
      - path: Glutt/Resources/Fonts/Nunito-Variable.ttf
        buildPhase: resources
      # Optional until the cooking-loop asset is checked into Resources/Animations.
      - path: Glutt/Resources/Animations/cooking-loop.mp4
        buildPhase: resources
        optional: true
    info:
      path: GluttShare/Info.plist
      properties:
        CFBundleDisplayName: Glutt
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - BricolageGrotesque-Variable.ttf
          - Nunito-Variable.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarlahmimi.glutt.share
        CODE_SIGN_ENTITLEMENTS: GluttShare/GluttShare.entitlements
        CURRENT_PROJECT_VERSION: 13
        MARKETING_VERSION: "1.2.1"
        SKIP_INSTALL: true

  GluttTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GluttTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Glutt

schemes:
  Glutt:
    build:
      targets:
        Glutt: all
    test:
      targets:
        - GluttTests
    run:
      config: Debug
      commandLineArguments:
        # Polly v2 Phase 1 transport spike screen. Tick in the scheme editor to
        # use on a device; deleted with the spike before the v2 merge.
        "-pollyV2Spike": false
    archive:
      config: Release

  # Runs the glasses memory matrix, which is skipped everywhere else because it
  # takes minutes and would distort the suite baseline.
  #
  # A separate scheme rather than a test plan or a `-only-testing` flag, because
  # the gate is an environment variable and there is no way to get one into a
  # unit-test host from the xcodebuild command line: plain `FOO=1 xcodebuild`
  # stops at the build system, and the `TEST_RUNNER_` prefix only reaches a
  # XCUITest runner process, not an app hosting unit tests. A scheme test action
  # is the one place that setting survives into the simulator.
  #
  #   xcodebuild test -scheme "Glutt Glasses Matrix" \
  #     -destination 'platform=iOS Simulator,name=iPhone 17' \
  #     -only-testing:GluttTests/GlassesMemoryMatrixTests/testA_timeVersusFrames \
  #     CODE_SIGN_IDENTITY="-"
  Glutt Glasses Matrix:
    build:
      targets:
        Glutt: [test]
    test:
      config: Debug
      environmentVariables:
        GLUTT_GLASSES_MATRIX: "1"
      targets:
        - GluttTests

  # Release-config scheme for testing a production-like build locally. Passes
  # `-seed` so demo recipes are populated when you RUN it from Xcode (handy for
  # testing with real-looking content). Note: launch arguments don't survive a
  # TestFlight upload, so actual distributed beta/App Store builds still start empty.
  Glutt Beta:
    build:
      targets:
        Glutt: all
    run:
      config: Release
      commandLineArguments:
        "-seed": true
    archive:
      config: Release
