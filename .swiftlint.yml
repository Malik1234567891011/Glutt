included:
  - Glutt
  - GluttTests

disabled_rules:
  - line_length
  - todo
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - sorted_first_last

identifier_name:
  min_length: 2
  excluded: [x, y, z, id]

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000
